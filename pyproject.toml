[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "rag-manual"
version = "0.2.0"
description = "PoC de RAG sobre o manual de manutenção de motores elétricos da WEG, com resposta citando a página"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.12"
dependencies = [
    "pypdf",
    "chromadb",
    "sentence-transformers",
    "rank-bm25",
    "openai",
]

[project.optional-dependencies]
dev = ["pytest", "ruff"]

[project.scripts]
rag-manual = "rag_manual.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.per-file-ignores]
"src/rag_manual/application/answering.py" = ["E501"]  # o prompt tem linhas longas de propósito
